name: Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  version-bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Determine version bump type
        id: bump-type
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          
          # Default to patch
          BUMP_TYPE="patch"
          
          # Check for version bump indicators
          if [[ "$PR_TITLE" =~ (BREAKING CHANGE|breaking change|BREAKING) ]] || [[ "$PR_BODY" =~ (BREAKING CHANGE|breaking change) ]] || [[ "$PR_LABELS" =~ (breaking|major) ]]; then
            BUMP_TYPE="major"
          elif [[ "$PR_TITLE" =~ (feat|feature) ]] || [[ "$PR_LABELS" =~ (feature|minor) ]]; then
            BUMP_TYPE="minor"
          elif [[ "$PR_TITLE" =~ (fix|bugfix|patch) ]] || [[ "$PR_LABELS" =~ (bug|patch) ]]; then
            BUMP_TYPE="patch"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Detected version bump type: $BUMP_TYPE"

      - name: Bump version
        id: version
        run: |
          npm version ${{ steps.bump-type.outputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.version.outputs.new_version }}"
          title: "chore: bump version to ${{ steps.version.outputs.new_version }}"
          body: |
            ## Automated Version Bump
            
            This PR was automatically created to bump the version to `${{ steps.version.outputs.new_version }}`.
            
            - Previous PR: #${{ github.event.pull_request.number }}
            - Bump type: ${{ steps.bump-type.outputs.bump_type }}
            
            ### Checklist
            - [ ] Version bump looks correct
            - [ ] CHANGELOG.md has been updated (if needed)
            
            Once this PR is merged, the package will be automatically published to npm.
          branch: version-bump-${{ steps.version.outputs.new_version }}
          delete-branch: true
          labels: |
            version-bump
            automated