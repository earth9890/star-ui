# GitHub Release configuration
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🎨 Style
      labels:
        - style
        - ui
        - ux
    - title: ♻️ Code Refactoring
      labels:
        - refactor
        - refactoring
    - title: ⚡ Performance Improvements
      labels:
        - performance
        - optimization
    - title: 🧪 Tests
      labels:
        - test
        - tests
        - testing
    - title: 🔧 Maintenance
      labels:
        - chore
        - maintenance
        - dependencies
    - title: Other Changes
      labels:
        - "*"